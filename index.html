<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KAPi Course Finder</title>
  <style>
    :root{
      --navy:#0b1f3a;
      --silver:#c7cbd1;
      --silver-2:#e7e9ee;
      --text:#0b1220;
      --bg:#f7f8fb;
      --card:#ffffff;
      --border:#d6d9e2;
      --shadow:0 8px 24px rgba(11,31,58,.10);
      --radius:14px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy) 220px, var(--bg) 220px, var(--bg) 100%);
      color: var(--text);
    }
    header{
      padding: 22px 16px 18px;
      color: white;
      max-width: 980px;
      margin: 0 auto;
    }
    .brandbar{ display:flex; align-items:center; gap:12px; }
    .badge{
      width:44px;height:44px; border-radius:12px;
      background: linear-gradient(135deg, var(--silver-2), var(--silver));
      display:grid; place-items:center;
      color: var(--navy); font-weight:800; letter-spacing:.5px;
      box-shadow: 0 10px 18px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }
    h1{ font-size: 20px; margin:0; line-height:1.2; }
    .sub{ margin-top:6px; opacity:.9; font-size: 13px; }

    main{ max-width: 980px; margin: 0 auto; padding: 0 16px 28px; }
    .panel{
      margin-top: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(199,203,209,.25);
      border-radius: var(--radius);
      padding: 12px;
      backdrop-filter: blur(8px);
    }
    .controls{
      display:grid;
      grid-template-columns: 1fr 150px 150px 150px;
      gap: 10px;
    }
    @media (max-width: 720px){ .controls{ grid-template-columns: 1fr 1fr; } }

    input, select{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(214,217,226,.55);
      background: rgba(255,255,255,.95);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus{
      border-color: var(--silver);
      box-shadow: 0 0 0 4px rgba(199,203,209,.25);
    }

    .content{ display:grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .topline{ display:flex; justify-content:space-between; gap: 10px; align-items:flex-start; flex-wrap:wrap; }
    .code{ display:inline-flex; align-items:center; gap:8px; font-weight: 800; color: var(--navy); font-size: 15px; }
    .tag{
      display:inline-flex; align-items:center;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(11,31,58,.18);
      background: linear-gradient(135deg, rgba(199,203,209,.45), rgba(231,233,238,.85));
      color: var(--navy); font-size: 12px; font-weight: 700;
    }
    .title{ margin-top: 8px; font-size: 16px; font-weight: 800; }
    .meta{
      margin-top: 8px;
      display:flex; flex-wrap:wrap; gap: 8px;
      font-size: 12.5px; color: rgba(11,18,32,.78);
    }
    .meta span{
      border: 1px solid rgba(214,217,226,.9);
      background: #fafbff;
      padding: 5px 9px;
      border-radius: 10px;
    }
    .text{ margin-top: 10px; font-size: 13.5px; line-height: 1.35; white-space: pre-wrap; }
    .muted{ color: rgba(11,18,32,.68); }

    .rec-yes{ color:#0f7a3d; font-weight:800; }
    .rec-no{ color:#b42318; font-weight:800; }
    .rec-cond{ color:#b78103; font-weight:800; }

    .footer{
      margin-top: 10px;
      display:flex; justify-content:space-between; gap: 10px; flex-wrap:wrap;
      font-size: 12px; color: rgba(255,255,255,.75);
    }
    .pillbtn{
      border: 1px solid rgba(199,203,209,.45);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:700;
      font-size: 12px;
    }
    .pillbtn:hover{ background: rgba(255,255,255,.14); }
    .status{ margin-top: 10px; color: rgba(11,18,32,.75); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brandbar">
      <div class="badge">KAPi</div>
      <div>
        <h1>KAPi Course Finder</h1>
        <div class="sub">Search “POSC”, “POSC 020”, “PBPL 177”, professor names, difficulty, workload, etc.</div>
      </div>
    </div>

    <div class="panel">
      <div class="controls">
        <input id="q" type="text" placeholder="Search: POSC, POSC 020, PBPL 177, Kang, 'heavy', etc." />
        <select id="subject">
          <option value="">All Subjects</option>
        </select>
        <select id="difficulty">
          <option value="">All Difficulty</option>
          <option value="1">1 (Easiest)</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5 (Hardest)</option>
        </select>
        <select id="recommend">
          <option value="">All Recommendations</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Only with certain professors">Only w/ certain profs</option>
          <option value="Conditional">Conditional</option>
        </select>
      </div>
      <div class="footer">
        <div>
          <button class="pillbtn" id="reset">Reset filters</button>
          <span style="margin-left:10px;">Data file: <b>courses.csv</b></span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="status" id="status">Loading…</div>
    <div class="content" id="results"></div>
  </main>

<script>
function parseCSV(text){
  const rows = [];
  let row = [], cur = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    const next = text[i+1];
    if(ch === '"' ){
      if(inQuotes && next === '"'){ cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if(ch === ',' && !inQuotes){
      row.push(cur); cur = '';
    } else if((ch === '\n' || ch === '\r') && !inQuotes){
      if(ch === '\r' && next === '\n') i++;
      row.push(cur); rows.push(row);
      row = []; cur = '';
    } else {
      cur += ch;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

const els = {
  q: document.getElementById('q'),
  subject: document.getElementById('subject'),
  difficulty: document.getElementById('difficulty'),
  recommend: document.getElementById('recommend'),
  results: document.getElementById('results'),
  status: document.getElementById('status'),
  reset: document.getElementById('reset')
};

let data = [];
let headers = [];

function esc(s){ return (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function normalize(s){ return (s ?? '').toString().toLowerCase().trim(); }
function compact(s){ return normalize(s).replace(/\s+/g,''); }
function uniqueSorted(arr){
  return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b));
}

function getAny(obj, keys){
  for(const k of keys){
    if(Object.prototype.hasOwnProperty.call(obj, k) && (obj[k] ?? '').toString().trim() !== '') return (obj[k] ?? '').toString().trim();
  }
  // return first existing key (even if empty) to avoid undefined
  for(const k of keys){
    if(Object.prototype.hasOwnProperty.call(obj, k)) return (obj[k] ?? '').toString().trim();
  }
  return '';
}

function splitCourseCode(code){
  // Accept: "POSC 020", "PBPL177", "PHIL 003W", etc.
  const s = (code ?? '').toString().trim();
  const m = s.match(/^([A-Za-z]+)\s*([0-9A-Za-z]+)$/);
  if(m) return {subj:m[1].toUpperCase(), num:m[2]};
  return {subj:'', num:s};
}

function buildSubjectOptions(){
  const subjects = uniqueSorted(data.map(d => d.Subject).filter(Boolean));
  subjects.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    els.subject.appendChild(opt);
  });
}

function matchesFilters(item){
  const qRaw = normalize(els.q.value);
  const qC = compact(qRaw);

  const subjFilter = els.subject.value;
  const diffFilter = els.difficulty.value;
  const recFilter = els.recommend.value;

  if(subjFilter && item.Subject !== subjFilter) return false;
  if(diffFilter && String(item.Difficulty || '') !== diffFilter) return false;
  if(recFilter && (item.Recommend || '') !== recFilter) return false;

  if(!qRaw) return true;
  return item.SearchIndex.includes(qRaw) || item.SearchIndexCompact.includes(qC);
}

function recClass(rec){
  const r = (rec || '').toLowerCase();
  if(r === 'yes') return 'rec-yes';
  if(r === 'no') return 'rec-no';
  return 'rec-cond';
}

function render(){
  const filtered = data.filter(matchesFilters);
  els.status.textContent = `${filtered.length} result(s)`;
  els.results.innerHTML = filtered.map(item => {
    const courseCode = [item.Subject, item.CourseNumber].filter(Boolean).join(' ').trim();
    return `
      <div class="card">
        <div class="topline">
          <div class="code">
            ${item.Subject ? `<span class="tag">${esc(item.Subject)}</span>` : ''}
            <span>${esc(courseCode || '(No course code)')}</span>
          </div>
          <div class="muted">Recommend: <b class="${recClass(item.Recommend)}">${esc(item.Recommend || '—')}</b></div>
        </div>
        <div class="title">${esc(item.CourseName || '')}</div>
        <div class="meta">
          ${item.Professor ? `<span><b>Prof</b>: ${esc(item.Professor)}</span>` : ''}
          ${item.QuarterYear ? `<span><b>Quarter</b>: ${esc(item.QuarterYear)}</span>` : ''}
          ${item.Division ? `<span><b>Division</b>: ${esc(item.Division)}</span>` : ''}
          ${item.Format ? `<span><b>Format</b>: ${esc(item.Format)}</span>` : ''}
          ${item.Difficulty ? `<span><b>Difficulty</b>: ${esc(item.Difficulty)}</span>` : ''}
          ${item.Workload ? `<span><b>Workload</b>: ${esc(item.Workload)}</span>` : ''}
          ${item.ReadingLoad ? `<span><b>Reading</b>: ${esc(item.ReadingLoad)}</span>` : ''}
          ${item.Textbook ? `<span><b>Textbook</b>: ${esc(item.Textbook)}</span>` : ''}
        </div>
        ${item.ProfessorReview ? `<div class="text"><b>Review:</b> ${esc(item.ProfessorReview)}</div>` : ''}
        ${item.SurvivalTips ? `<div class="text"><b>Tips:</b> ${esc(item.SurvivalTips)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function wire(){
  els.q.addEventListener('input', render);
  els.subject.addEventListener('change', render);
  els.difficulty.addEventListener('change', render);
  els.recommend.addEventListener('change', render);
  els.reset.addEventListener('click', () => {
    els.q.value = '';
    els.subject.value = '';
    els.difficulty.value = '';
    els.recommend.value = '';
    render();
  });
}

// Load courses.csv from same folder
fetch('courses.csv', {cache:'no-store'})
  .then(r => {
    if(!r.ok) throw new Error('Could not load courses.csv');
    return r.text();
  })
  .then(text => {
    const rows = parseCSV(text).filter(r => r.length && r.some(x => (x||'').trim() !== ''));
    headers = rows.shift().map(h => (h || '').trim());

    data = rows.map(r => {
      const raw = {};
      headers.forEach((h,i) => raw[h] = (r[i] ?? '').trim());

      // Supports BOTH:
      //  A) clean headers: "Subject", "Course Number", ...
      //  B) Google Form headers: "Subject (i.e. PBPL)", "Course Number (i.e. PBPL 177)", ...
      const SubjectRaw = getAny(raw, ["Subject", "Subject (i.e. PBPL)"]);
      const CourseCodeRaw = getAny(raw, ["Course Code", "Course Number (i.e. PBPL 177)"]);
      const CourseNumberRaw = getAny(raw, ["Course Number", "Course Number (i.e. PBPL 177)"]);

      // If we have a combined course code like "POSC 020", split it
      const split = splitCourseCode(CourseNumberRaw || CourseCodeRaw);

      const Subject = (SubjectRaw || split.subj || '').toUpperCase();
      // If CourseNumberRaw is combined like "POSC 020", use just numeric/alphanum piece
      let CourseNumber = getAny(raw, ["Course Number"]);
      if(!CourseNumber) CourseNumber = split.num || '';
      // If CourseNumber is still combined, split again
      const split2 = splitCourseCode(CourseNumber);
      if(split2.subj && !Subject) Subject = split2.subj;
      if(split2.num) CourseNumber = split2.num;

      const CourseName = getAny(raw, ["Course Name", "Course Name (i.e. Housing Policy)"]);
      const Professor = getAny(raw, ["Professor", "Professor Name"]);
      const QuarterYear = getAny(raw, ["Quarter/Year", "Quarter/Year Taken (i.e. Spring 2025)"]);
      const Division = getAny(raw, ["Division", "Upper- or Lower-Division"]);
      const Format = getAny(raw, ["Format", "In-Person / Hybrid / Online"]);
      const Textbook = getAny(raw, ["Textbook", "Textbook Required?"]);
      const ReadingLoad = getAny(raw, ["Reading Load"]);
      const Workload = getAny(raw, ["Workload"]);
      const DifficultyRaw = getAny(raw, ["Difficulty", "Overall Difficulty (1–5 scale)"]);
      const Recommend = getAny(raw, ["Recommend", "Would You Recommend This Class?"]);
      const ProfessorReview = getAny(raw, ["Professor Review"]);
      const SurvivalTips = getAny(raw, ["Survival Tips", "Any Survival Tips? (Ex: “start readings early,” “go to section,” \"take detailed notes\")"]);

      // Normalize difficulty to 1..5
      let Difficulty = '';
      const m = (DifficultyRaw || '').toString().match(/\d+/);
      if(m) Difficulty = m[0];

      const courseCode = [Subject, CourseNumber].filter(Boolean).join(' ').trim();

      const allText = [
        Subject, CourseNumber, courseCode,
        CourseName, Professor, QuarterYear, Division, Format,
        Textbook, ReadingLoad, Workload, Difficulty, Recommend,
        ProfessorReview, SurvivalTips
      ].filter(Boolean).join(' ');

      return {
        Subject, CourseNumber, CourseName, Professor, QuarterYear,
        Division, Format, Textbook, ReadingLoad, Workload,
        Difficulty, Recommend, ProfessorReview, SurvivalTips,
        SearchIndex: normalize(allText),
        SearchIndexCompact: compact(allText)
      };
    });

    buildSubjectOptions();
    wire();
    render();
  })
  .catch(err => {
    els.status.textContent = "Couldn't load courses.csv. Keep index.html and courses.csv in the same folder.";
    console.error(err);
  });
</script>
</body>
</html>
